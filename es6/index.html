<!doctype html>
<html>
    <head>
        <title>JsPlumb - rendering selections example</title>
        <link rel="stylesheet" href="node_modules/@jsplumbtoolkit/browser-ui/css/jsplumbtoolkit.css">
        <link rel="stylesheet" href="app.css">
    </head>

    <body>

        <div id="main">

            <div id="canvas"></div>

            <div id="neighbours" class="popup">
                <div class="title">
                    <span>Neighbours</span>
                    <div class="toggle" aria-label="tap to hide/show" title="tap to hide/show"></div>
                </div>
                <div class="content"></div>
            </div>
            <div id="successors" class="popup">
                <div class="title">
                    <span>Successors</span>
                    <div class="toggle" aria-label="tap to hide/show" title="tap to hide/show"></div>
                </div>
                <div class="content"></div>
            </div>
            <div id="predecessors" class="popup">
                <div class="title">
                    <span>Predecessors</span>
                    <div class="toggle" aria-label="tap to hide/show" title="tap to hide/show"></div>
                </div>
                <div class="content"></div>
            </div>
            <div id="siblings" class="popup">
                <div class="title">
                    <span>Siblings</span>
                    <div class="toggle" aria-label="tap to hide/show" title="tap to hide/show"></div>
                </div>
                <div class="content"></div>
            </div>

        </div>

        <script src="bundle.js"></script>

    </body>
</html>
